schema_version: 4

selection_order:
  - image_type
  - preset
  - platform
  - layout_mode
  - slide_count
  - visual_style
  - scene_or_symbol

prompt_blocks:
  required:
    - source_grounding
    - primary_task
    - composition_and_layout
    - visual_style_and_materials
    - exact_text
    - aspect_and_output
    - constraints_and_avoid
  optional:
    - reference_image_roles
    - source_facts
    - brand_asset_roles
    - lighting_and_mood
    - variant_axes

templates:
  - id: godot_pixel_metaphor
    image_type: [cover, poster]
    reference: prompt-godot-pixel-metaphor.md
    default_aspect: "16:9"
    output_stem: godot-pixel-metaphor
    text_density: low
    use_when: "文章需要用一个游戏世界和单一视觉隐喻表达核心冲突"

  - id: editorial_summary_card
    image_type: [summary_card]
    reference: prompt-editorial-summary-card.md
    default_aspect: "4:5"
    output_stem: editorial-summary-card
    text_density: medium
    use_when: "正文需要一张观点小结图，突出主命题、关键词与补充解释"

  - id: cornell_notes
    image_type: [learning_note, summary_card]
    reference: prompt-cornell-notes-infographic.md
    default_aspect: "A4-portrait"
    output_stem: cornell-notes
    text_density: high
    use_when: "文章适合转成问题线索、模块化笔记、回顾总结和一句话记忆"

  - id: social_skill_catalog
    image_type: [social_card, carousel]
    reference: prompt-social-skill-catalog.md
    contract: social-card-contract.yml
    default_aspect: "4:5"
    output_stem: social-skill-catalog
    text_density: high
    batch_consistency: required
    render_modes: [direct_poster, hybrid_exact_text]
    default_render_mode: direct_poster
    deterministic_fields: [claim, skill_labels, install_command, repository_url, qr_code, brand_logos]
    use_when: "需要把开源技能库、插件集合或产品能力清单做成朋友圈单图或小红书轮播，并确保数量、命令、URL 与二维码可机械核验"

  - id: plugin_icon
    image_type: [icon]
    reference: prompt-plugin-icon.md
    default_aspect: "1:1"
    output_stem: plugin-icon
    text_density: low
    batch_consistency: required
    two_stage: true
    use_when: "需要插件市场图标、应用图标或技能库标识；本模板产出设计稿，终稿须矢量确定性重绘"
