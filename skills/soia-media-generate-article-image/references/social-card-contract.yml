schema_version: 2

narrative_modes:
  repository_feature_pair:
    default_slide_count: 2
    slides:
      - role: repository_recommendation
        required_sections: [hook, proof_scale, capability_structure, featured_skill, deliverable_shape, cta]
      - role: featured_skill_deep_dive
        required_sections: [hook, inputs, capabilities, advantages, workflow, deliverables, validation, guardrails, cta]
    required_sources: [repository_readme, featured_skill_md, facts_yml, content_facts_yml]
    forbid_abstract_extra_slide_without_real_evidence: true
    forbid_unsourced_evidence_values: true

platforms:
  rednote:
    layout_modes:
      carousel:
        aspect: "4:5"
        min_slides: 2
        max_slides: 12
        preferred_slide_counts: [2, 3]
        max_catalog_items_per_slide: 6
        required_roles: [cover, catalog, cta]
        optional_roles: [highlight]
      single:
        aspect: "4:5"
        min_slides: 1
        max_slides: 1
        max_catalog_items_per_slide: 4
        required_roles: [cover, catalog, cta]
  wechat-moments:
    layout_modes:
      single:
        aspect: "4:5"
        min_slides: 1
        max_slides: 1
        max_catalog_items_per_slide: 4
        required_roles: [cover, catalog, cta]
      carousel:
        aspect: "4:5"
        min_slides: 2
        max_slides: 9
        preferred_slide_counts: [2, 3]
        max_catalog_items_per_slide: 6
        required_roles: [cover, catalog, cta]
        optional_roles: [highlight]
  general:
    layout_modes:
      carousel:
        aspect: "4:5"
        min_slides: 2
        max_slides: 12
        preferred_slide_counts: [2, 3]
        max_catalog_items_per_slide: 6
        required_roles: [cover, catalog, cta]
        optional_roles: [highlight]

deterministic_fields:
  - claim
  - skill_labels
  - install_command
  - repository_url
  - qr_code
  - brand_logos

required_quality_evidence:
  - deterministic_text
  - ocr_exact_match
  - approved_brand_assets
  - mobile_preview
  - view_image
  - hero_art_reviewed
  - semantic_density_review
  - source_claim_traceability
  - hallucinated_evidence_scan
