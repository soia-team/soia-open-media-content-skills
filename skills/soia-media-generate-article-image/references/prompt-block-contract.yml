schema_version: 1

# The index selects blocks; this contract makes every selected block executable.
# A short style label is never sufficient input to imagegen.
purpose: "把结构、机制、美学和文字词条编译成带事实、参数、约束和验收的可执行 Prompt"

required_fields:
  - source_grounding
  - role_in_frame
  - composition_parameters
  - visual_parameters
  - exact_text_policy
  - constraints_and_avoid
  - acceptance_checks

compile_rules:
  - "每个选择的块都必须填入本契约的 compile_fields；禁止只输出块名或形容词。"
  - "source_grounding、exact_text_policy 和 constraints_and_avoid 必须逐图落盘。"
  - "没有来源的数字、地名、人物身份、价格、URL、品牌和效果承诺必须删除或标注 synthetic_test_data。"
  - "移动端/缩略图任务必须写出阅读顺序和最小可读字段。"
  - "高风险中文、命令、URL、二维码使用 hybrid_exact_text 或确定性文字层，不把模型看似写对当成事实证明。"

information_structures:
  single_hook:
    reference: prompt-structure-single-hook.md
    compile_fields: [primary_hook, support_facts_1_to_3, cta_or_source, mobile_read_order]
    acceptance: [one_primary_judgement, no_competing_panels, title_readable_at_thumbnail]
  knowledge_card:
    reference: prompt-structure-knowledge-card.md
    compile_fields: [primary_claim, knowledge_points_3_to_5, evidence_or_examples, source_label]
    acceptance: [each_region_adds_new_information, hierarchy_is_obvious, no_fabricated_facts]
  deck_page:
    reference: prompt-structure-deck-page.md
    compile_fields: [page_role, title, focal_visual, body_points_3_to_5, footer_baseline]
    acceptance: [one_page_role, shared_baseline, readable_title_and_body]
  deck_series:
    reference: prompt-structure-deck-series.md
    compile_fields: [series_bible, page_role_table_10, per_page_points_3_to_5, rhythm_variables]
    acceptance: [non_repeating_roles, fixed_visual_base, page_to_page_consistency]
  carousel_sequence:
    reference: prompt-structure-carousel-sequence.md
    compile_fields: [slide_count, hook_slide, teaching_slides, cta_slide, mobile_safe_area]
    acceptance: [first_slide_stops_scroll, sequence_has_progression, cta_is_traceable]
  portrait_brief:
    reference: prompt-structure-portrait-brief.md
    compile_fields: [subject_identity, age_boundary, pose_expression, wardrobe, light_lens_scene, intended_use]
    acceptance: [identity_scope_is_authorized, anatomy_is_plausible, negative_space_is_preserved]
  campaign_pack:
    reference: prompt-structure-campaign-pack.md
    compile_fields: [shared_facts, approved_assets, shared_visual_base, role_table, cta]
    acceptance: [each_asset_has_role, facts_are_consistent, no_duplicate_filler_pages]
  logo_system:
    reference: prompt-structure-logo-system.md
    compile_fields: [brand_name, mark_concept, lockup_variants, color_variants, clear_space_ratio, min_size_px]
    acceptance: [same_geometry_across_variants, wordmark_is_sourced, svg_master_exists]

text_strategies:
  exact_text:
    reference: prompt-text-exact-layer.md
    compile_fields: [verbatim_fields, field_priority, fallback_render_mode]
    acceptance: [title_numbers_names_urls_checked, failed_fields_isolated]
  cjk_exact_text:
    reference: prompt-text-cjk-exact-layer.md
    compile_fields: [short_cjk_fields, font_size_hierarchy, hybrid_exact_text_trigger]
    acceptance: [cjk_is_legible, punctuation_preserved, no_random_glyphs]
  hero_typography:
    reference: prompt-text-hero-typography.md
    compile_fields: [hero_text, type_scale, tracking_leading, safe_area, secondary_text_slots]
    acceptance: [hero_is_first_read, glyphs_are_complete, body_is_not_oversized]
  latin_hero_type:
    reference: prompt-text-latin-hero-type.md
    compile_fields: [latin_word, case_spelling, glyph_material, cjk_fact_slots]
    acceptance: [latin_spelling_exact, cjk_facts_separate, word_remains_readable]
  quote_led:
    reference: prompt-text-quote-led.md
    compile_fields: [source_quote, attribution_boundary, short_supporting_line, source_marker]
    acceptance: [quote_is_sourced, attribution_not_invented, no_fake_authority]
  logo_wordmark:
    reference: prompt-text-logo-wordmark.md
    compile_fields: [verbatim_wordmark, case_and_language, approved_font_or_path, tracking_and_baseline, outline_requirement]
    acceptance: [wordmark_is_exact, font_or_path_is_approved, no_uninstalled_font_dependency]

