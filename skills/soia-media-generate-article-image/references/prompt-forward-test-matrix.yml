known_limitations:
  - "imagegen 可生成可读海报，但不能替代 facts.yml、OCR/二维码机器核验。"
  - "模型可能为高密度目录卡补写示例条目；生产路径必须使用 source_grounding + hybrid_exact_text。"
  - "肖像家族没有参考图时只能验收单张内部一致性，不能声称跨图身份锁定。"
  - "brand_logo 的方向稿仍需 imagegen/view_image；本矩阵只锁定第二阶段 SVG 结构，不把 SVG 合同测试当作 PNG 视觉通过。"
